<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guías de examen</title>
<meta name="description" content="Guías de estudio por curso y examen: elige una clase y entra a su guía, repaso, ejercicios y laboratorio.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html" aria-label="Inicio"><img src="img/logo.svg" alt="" width="28" height="28"></a>
  <div class="brand">Guías de examen <span>· Todas las clases</span></div>
  <div class="spacer"></div>
</header>
<main class="portal">
  <section class="hero">
    <p class="eyebrow">Elige tu curso</p>
    <h1>Examenes<br> Ingenieria en Sistemas</h1>
    <p class="lede">Cada tarjeta abre la guía completa de un examen.</p>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="buscar" type="search" placeholder="Buscar curso o examen" aria-label="Buscar curso o examen" autocomplete="off">
    </label>
  </section>
  <div id="cursos"></div>
  <footer class="credit">Desarrollado por Oskar · <span>@k0k4depelover</span></footer>
</main>
<script src="js/examenes.js"></script>
<script src="js/portal.js"></script>

</html>
